<svg width="1500" height="500" viewBox="0 0 1500 500" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000814"/>
      <stop offset="45%" stop-color="#000B26"/>
      <stop offset="75%" stop-color="#001846"/>
      <stop offset="100%" stop-color="#003C82"/>
    </linearGradient>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8FBFF"/>
      <stop offset="25%" stop-color="#87CEEB"/>
      <stop offset="60%" stop-color="#1E90FF"/>
      <stop offset="100%" stop-color="#0000B0"/>
    </radialGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#001846"/>
      <stop offset="100%" stop-color="#000814"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="50%" stop-color="#4FA8E8"/>
      <stop offset="100%" stop-color="#1E5FD9"/>
    </linearGradient>
    <clipPath id="frameClip">
      <rect width="1500" height="500" rx="0"/>
    </clipPath>
    <linearGradient id="fadeTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000814" stop-opacity="1"/>
      <stop offset="100%" stop-color="#000814" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#frameClip)">
    <!-- sky -->
    <rect width="1500" height="500" fill="url(#skyGrad)"/>

    <!-- stars -->
    <g fill="#87CEEB">
      <circle cx="90" cy="60" r="1.6" opacity="0.8"/>
      <circle cx="230" cy="40" r="1.2" opacity="0.6"/>
      <circle cx="1350" cy="55" r="1.6" opacity="0.8"/>
      <circle cx="1240" cy="90" r="1.2" opacity="0.6"/>
      <circle cx="500" cy="30" r="1" opacity="0.5"/>
      <circle cx="980" cy="45" r="1.3" opacity="0.6"/>
      <circle cx="60" cy="150" r="1" opacity="0.5"/>
      <circle cx="1430" cy="160" r="1.3" opacity="0.6"/>
      <circle cx="720" cy="25" r="1" opacity="0.5"/>
    </g>

    <!-- horizon glow sun -->
    <circle cx="750" cy="270" r="130" fill="url(#sunGrad)"/>
    <!-- sun horizontal bars (retro sliced sun) -->
    <g fill="#000814">
      <rect x="620" y="280" width="260" height="10"/>
      <rect x="620" y="300" width="260" height="12"/>
      <rect x="620" y="322" width="260" height="14"/>
      <rect x="620" y="346" width="260" height="16"/>
      <rect x="620" y="372" width="260" height="18"/>
    </g>

    <!-- ground -->
    <rect x="0" y="340" width="1500" height="160" fill="url(#groundGrad)"/>

    <!-- perspective grid lines converging to vanishing point -->
    <g stroke="#4FA8E8" stroke-width="1.4" opacity="0.75">
      <line x1="750" y1="340" x2="0" y2="500"/>
      <line x1="750" y1="340" x2="160" y2="500"/>
      <line x1="750" y1="340" x2="330" y2="500"/>
      <line x1="750" y1="340" x2="520" y2="500"/>
      <line x1="750" y1="340" x2="640" y2="500"/>
      <line x1="750" y1="340" x2="860" y2="500"/>
      <line x1="750" y1="340" x2="980" y2="500"/>
      <line x1="750" y1="340" x2="1170" y2="500"/>
      <line x1="750" y1="340" x2="1340" y2="500"/>
      <line x1="750" y1="340" x2="1500" y2="500"/>
    </g>
    <!-- horizontal grid lines -->
    <g stroke="#4FA8E8" stroke-width="1.2" opacity="0.55">
      <line x1="0" y1="360" x2="1500" y2="360"/>
      <line x1="0" y1="390" x2="1500" y2="390"/>
      <line x1="0" y1="425" x2="1500" y2="425"/>
      <line x1="0" y1="465" x2="1500" y2="465"/>
    </g>

    <!-- subtle top fade for text legibility -->
    <rect width="1500" height="180" fill="url(#fadeTop)"/>

    <!-- title -->
    <text x="750" y="140" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="url(#titleGrad)">
      Hey there, I'm Gautham Krishna
    </text>
    <text x="750" y="185" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#B7E1F7" opacity="0.9">
      Full Stack Developer &#8226; Open Source Enthusiast
    </text>
  </g>
</svg>
