<svg width="1200" height="140" viewBox="0 0 1200 140" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgStrip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000814" stop-opacity="0"/>
      <stop offset="50%" stop-color="#001846"/>
      <stop offset="100%" stop-color="#000814" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="pulseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#87CEEB" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#1E5FD9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1E5FD9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="140" fill="url(#bgStrip)"/>

  <!-- pulsing center glow -->
  <circle cx="600" cy="70" r="40" fill="url(#pulseGlow)">
    <animate attributeName="r" values="30;55;30" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- scrolling grid lines (horizontal) -->
  <g stroke="#4FA8E8" stroke-width="1" opacity="0.5">
    <line x1="0" y1="30" x2="1200" y2="30"/>
    <line x1="0" y1="110" x2="1200" y2="110"/>
  </g>

  <!-- moving particles along the strip -->
  <g fill="#87CEEB">
    <circle cx="0" cy="70" r="3">
      <animate attributeName="cx" values="0;1200" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="40" r="2">
      <animate attributeName="cx" values="0;1200" dur="5.5s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="5.5s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="100" r="2.4">
      <animate attributeName="cx" values="0;1200" dur="4.8s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="4.8s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="55" r="1.8">
      <animate attributeName="cx" values="0;1200" dur="6s" begin="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="6s" begin="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- side accent chevrons pulsing -->
  <g fill="#87CEEB">
    <path d="M120 70 l14 -14 l0 8 l-8 6 l8 6 l0 8 z" opacity="0.8">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M1080 70 l-14 -14 l0 8 l8 6 l-8 6 l0 8 z" opacity="0.8">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.2s" begin="1.1s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
